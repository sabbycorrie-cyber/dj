<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - DJ Studio</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/normalize.css">
    <style>
        :root {
            --accent: #d8f2b8;
            --bg-dark: #0f1210;
            --surface: #161c18;
            --text-main: #f0f4ef;
            --text-muted: #9aa89a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 8%;
            background-color: var(--surface);
            border-bottom: 1px solid rgba(216, 242, 184, 0.1);
        }

        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        nav ul {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        nav ul a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        nav ul a:hover, nav ul a.active {
            color: var(--accent);
        }

        /* Main Content Layout */
        main {
            flex: 1;
            padding: 4rem 8%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
        }

        h1 span {
            color: var(--accent);
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Buttons */
        .btn {
            background-color: var(--accent);
            color: var(--bg-dark);
            padding: 0.8rem 2rem;
            font-weight: 700;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: var(--surface);
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(216, 242, 184, 0.05);
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">DJ Studio</a>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Where Sound Meets <span>Innovation</span></h1>
        <p>Experience the ultimate fusion of live electronic music production and cutting-edge digital performance.</p>
        <a href="about.html" class="btn">Explore Product</a>
    </main>

    <footer>
        <p>&copy; 2026 DJ Studio Group Project. All rights reserved.</p>
    </footer>

    <script>
        const randomColors = ['#d8f2b8', '#b8f2e6', '#f2b8b8', '#f2e2b8', '#e2b8f2'];
        const interactiveElements = document.querySelectorAll('a, .btn');

        interactiveElements.forEach(element => {
            element.addEventListener('mouseenter', () => {
                const randomColor = randomColors[Math.floor(Math.random() * randomColors.length)];
                element.style.color = randomColor;
                element.style.borderColor = randomColor;
            });

            element.addEventListener('mouseleave', () => {
                element.style.color = '';
                element.style.borderColor = '';
            });
        });
    </script>
</body>
</html>
