<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/contact.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">
    <title>Contact Us</title>
</head>


<body>
<!-- HEADER -->
<header>
        <nav class="navbar">
            <div class="logo">DJ BEATS</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>
<!-- HEADER -->

<!-- FORM -->
    <main class="container">
            <div class="form__container">
                <form action="">
                    <h2 class="contact-us">Contact Us</h2>
                <!-- name -->
                <div class="container__input-field-name">
                    <label for="first-name" class="label">Your name</label>
                    <br>
                    <input type="text" placeholder="First name" id="first-name" class="input-field-name" required autofocus>
                    <input type="text" placeholder="Last name" class="input-field-name input-field-lastName">
                    <br>
                </div>
                <!-- email -->
                <div class="container__input-field-email">
                    <label for="email" class="label">Your email</label>
                    <br>
                    <input type="email" placeholder="example@email.com" id="email" class="input-field input-field-email" required>
                    <br>
                </div>
                <!-- message -->
                <div class="container__input-field-message">
                    <label for="message">Your message</label>
                    <br>
                    <textarea name="message" placeholder="Message" required maxlength="400" rows="10" id="message" class="input-field message-input-field"></textarea>
                    <br>
                </div>
                <!-- button -->
                <div class="container__button">
                    <button type="submit" class="btn">Submit</button>
                </div>
                </form>
        </div>
    </main>
<!-- FORM -->

    <script>
        const randomColors = ['#d8f2b8', '#b8f2e6', '#f2b8b8', '#f2e2b8', '#e2b8f2'];
        const headerLinks = document.querySelectorAll('header nav ul a');

        headerLinks.forEach(link => {
            link.addEventListener('mouseenter', () => {
                const randomColor = randomColors[Math.floor(Math.random() * randomColors.length)];
                link.style.color = randomColor;
            });

            link.addEventListener('mouseleave', () => {
                link.style.color = '';
            });
        });
    </script>

</body>
</html>
