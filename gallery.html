<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - DJ Studio</title>

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/gallery.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">DJ Studio</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Photo <span>Gallery</span></h1>

        <div class="gallery">
            <span><img src="images/1.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/2.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/3.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/4.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/5.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/6.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/7.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/8.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/9.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/10.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/11.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>

            <span><img src="images/12.jpg" class="thumbnail" onclick="showLightbox(this)" alt="Party">
            </span>
        </div>
    </main>



    <dialog id="lightbox" class="lightbox">
    <div class="lightbox-content">
        <img id="lightbox-img" src="images/party.jpg" alt="Large View" class="lightbox-img" onclick="document.getElementById('lightbox').close()">
    </div>
    </dialog>


    <script>
        function showLightbox(img) {
            document.getElementById('lightbox-img').src = img.src;
            document.getElementById('lightbox').showModal();
        }
    </script>

    <script>
        const randomColors = ['#d8f2b8', '#b8f2e6', '#f2b8b8', '#f2e2b8', '#e2b8f2'];
        const headerLinks = document.querySelectorAll('header nav ul a');

        headerLinks.forEach(link => {
            link.addEventListener('mouseenter', () => {
                const randomColor = randomColors[Math.floor(Math.random() * randomColors.length)];
                link.style.color = randomColor;
            });

            link.addEventListener('mouseleave', () => {
                link.style.color = '';
            });
        });
    </script>

    <footer>
        <p>&copy; 2026 DJ Studio Group Project. All rights reserved.</p>
    </footer>


</body>
</html>
